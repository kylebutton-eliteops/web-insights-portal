<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Web Insights Portal{% endblock %}</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1b2430; --muted: #5d6b7c; --line: #dfe3e8;
    --brand: #1f3a5f; --brand-ink: #ffffff; --accent: #2f6fd6; --ok: #1e7a46; --warn: #a15c00; --err: #b3261e;
    --chip: #eef2f7;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11161c; --panel: #19212a; --ink: #e6ebf1; --muted: #9aa8b8; --line: #2a3542;
            --brand: #24476f; --accent: #6ea2ff; --ok: #5cc98b; --warn: #f0b45a; --err: #ff8a80; --chip: #222d39; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  header { background: var(--brand); color: var(--brand-ink); }
  header .wrap { display: flex; align-items: center; gap: 24px; padding: 14px 20px; }
  header a { color: var(--brand-ink); text-decoration: none; opacity: .85; }
  header a:hover, header a.on { opacity: 1; text-decoration: underline; }
  header .name { font-weight: 650; font-size: 17px; opacity: 1; margin-right: auto; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 20px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 22px; margin-bottom: 20px; }
  h1 { font-size: 24px; margin: 0 0 6px; } h2 { font-size: 18px; margin: 0 0 12px; } h3 { font-size: 15px; margin: 18px 0 6px; }
  p { margin: 0 0 12px; } .muted { color: var(--muted); }
  label { display: block; font-weight: 600; margin: 14px 0 6px; }
  input[type=text], input[type=password] { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 6px;
         background: var(--bg); color: var(--ink); font: inherit; }
  input[type=file] { font: inherit; }
  .check { display: flex; gap: 10px; align-items: flex-start; font-weight: 500; }
  .check input { margin-top: 4px; }
  button, .btn { display: inline-block; background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 10px 18px;
         font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; }
  .btn.secondary { background: var(--chip); color: var(--ink); border: 1px solid var(--line); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .stat { background: var(--chip); border-radius: 8px; padding: 12px 14px; }
  .stat b { display: block; font-size: 22px; } .stat span { color: var(--muted); font-size: 13px; }
  .bar { height: 10px; background: var(--chip); border-radius: 6px; overflow: hidden; }
  .bar div { height: 100%; background: var(--accent); width: 0; transition: width .4s; }
  .note { border-left: 4px solid var(--warn); background: var(--chip); padding: 10px 14px; border-radius: 4px; margin: 12px 0; }
  .note.err { border-color: var(--err); } .note.ok { border-color: var(--ok); }
  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 7px 9px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { background: var(--chip); position: sticky; top: 0; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  code { background: var(--chip); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  ol li, ul li { margin-bottom: 6px; }
  details summary { cursor: pointer; font-weight: 600; margin: 10px 0; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  @media (max-width: 640px) { header .wrap { flex-wrap: wrap; gap: 12px; } .wrap { padding: 16px; } }
</style>
</head>
<body>
<header><div class="wrap">
  <a class="name" href="{{ url_for('index') }}">Web Insights Portal</a>
  <a href="{{ url_for('index') }}" class="{{ 'on' if request.endpoint == 'index' }}">Upload</a>
  <a href="{{ url_for('help_page') }}" class="{{ 'on' if request.endpoint == 'help_page' }}">How to use</a>
</div></header>
<main class="wrap">
{% block body %}{% endblock %}
</main>
</body>
</html>
